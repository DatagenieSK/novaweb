<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; base-uri 'self';">
    <title>NovaOps | Admin Panel</title>
    <meta name="theme-color" content="#7D0433">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Restore normal visible cursors for admin panel */
        *, *::before, *::after {
            cursor: auto !important;
        }

        button, a, .btn-primary, .btn-secondary, input[type="submit"] {
            cursor: pointer !important;
        }

        input, textarea {
            cursor: text !important;
        }

        /* Admin specific layout styles overlaying style.css */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .admin-header {
            padding: 1.5rem 5%;
            border-bottom: 3px solid var(--border-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-cream);
        }

        .admin-main {
            flex: 1;
            padding: 4rem 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Login Box */
        .login-box {
            background: #fff;
            border: 3px solid var(--border-dark);
            box-shadow: 8px 8px 0px 0px var(--border-dark);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 1rem;
            margin: 1.5rem 0;
            border: 2px solid var(--border-dark);
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
        }

        .login-box input:focus {
            box-shadow: 4px 4px 0px 0px var(--accent-orange);
        }

        .error-msg {
            color: var(--accent-orange);
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 1rem;
            display: none;
        }

        /* Dashboard */
        .dashboard {
            width: 100%;
            max-width: 900px;
            display: none;
        }

        .submissions-grid {
            display: grid;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .sub-card {
            background: #fff;
            border: 3px solid var(--border-dark);
            padding: 2rem;
            box-shadow: 6px 6px 0px 0px var(--border-dark);
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #555;
        }

        .sub-card h4 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-orange);
            font-family: var(--font-heading);
        }
    </style>
</head>

<body>

    <header class="admin-header">
        <div class="logo">
            <a href="index.html" class="logo-link">
                <img src="assets/logo.png" alt="NovaOps Logo" class="nav-logo-img">
            </a>
            <span style="font-weight: 400; font-size: 1.1rem;">| Admin Panel</span>
        </div>
        <a href="index.html" class="btn-secondary" style="font-size: 0.9rem; font-weight: bold;">← Back to Site</a>
    </header>

    <main class="admin-main">
        <div id="loginView" class="login-box">
            <h2 style="font-family: var(--font-heading); font-size: 2rem;">Access Panel</h2>
            <input type="password" id="adminPassword" placeholder="Enter Password">
            <button id="loginBtn" class="btn-primary" style="width: 100%;">Unlock Dashboard</button>
            <p id="errorMsg" class="error-msg">Incorrect Password.</p>
        </div>

        <div id="dashboardView" class="dashboard">
            <div
                style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <h2 style="font-family: var(--font-heading); font-size: 2.5rem;">Client Submissions</h2>
                <div style="display: flex; gap: 0.8rem; flex-wrap: wrap;">
                    <button id="logoutBtn" class="btn-secondary" style="border: 2px solid var(--border-dark); padding: 0.5rem 1rem; background-color: #fff;">Lock Session</button>
                    <button id="clearDataBtn" class="btn-secondary"
                        style="color: red; border: 2px solid red; padding: 0.5rem 1rem; background-color: #fff;">Clear All
                        Data</button>
                </div>
            </div>

            <div id="submissionsContainer" class="submissions-grid">
            </div>
        </div>
    </main>

    <script>
        // Salted cryptographic hash of the admin password (SHA-256)
        // Eliminates plaintext passwords from client source code
        const SALT = "novaops_secure_salt_2026_";
        const TARGET_HASH = "ea3b337fa33325d408334c691d152da1998db16cefd3d7af2ff9675bdc5ba544";

        const loginBtn = document.getElementById('loginBtn');
        const passInput = document.getElementById('adminPassword');
        const errorMsg = document.getElementById('errorMsg');
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const container = document.getElementById('submissionsContainer');
        const clearBtn = document.getElementById('clearDataBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        let failedAttempts = 0;
        let lockoutTimer = null;

        // Hash function using browser-native Web Crypto API
        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const digest = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(digest))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // Check if session is already authenticated
        if (sessionStorage.getItem('nova_admin_auth') === 'true') {
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            loadSubmissions();
        }

        // Allow pressing "Enter" to login
        passInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loginBtn.click();
        });

        loginBtn.addEventListener('click', async () => {
            if (lockoutTimer) return;

            const enteredPass = passInput.value;
            if (!enteredPass) return;

            const computedHash = await sha256(SALT + enteredPass);

            if (computedHash === TARGET_HASH) {
                failedAttempts = 0;
                sessionStorage.setItem('nova_admin_auth', 'true');
                loginView.style.display = 'none';
                dashboardView.style.display = 'block';
                passInput.value = '';
                errorMsg.style.display = 'none';
                loadSubmissions();
            } else {
                failedAttempts++;
                passInput.value = '';
                if (failedAttempts >= 5) {
                    let secondsLeft = 30;
                    loginBtn.disabled = true;
                    passInput.disabled = true;
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = `Too many attempts. Locked for ${secondsLeft}s.`;

                    lockoutTimer = setInterval(() => {
                        secondsLeft--;
                        if (secondsLeft <= 0) {
                            clearInterval(lockoutTimer);
                            lockoutTimer = null;
                            failedAttempts = 0;
                            loginBtn.disabled = false;
                            passInput.disabled = false;
                            errorMsg.textContent = 'Incorrect Password.';
                            errorMsg.style.display = 'none';
                        } else {
                            errorMsg.textContent = `Too many attempts. Locked for ${secondsLeft}s.`;
                        }
                    }, 1000);
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = `Incorrect Password. (${5 - failedAttempts} attempts remaining)`;
                }
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('nova_admin_auth');
            dashboardView.style.display = 'none';
            loginView.style.display = 'block';
            container.innerHTML = '';
        });

        // XSS-Safe Submissions Rendering using strict DOM nodes (no innerHTML injection)
        function loadSubmissions() {
            const novaData = JSON.parse(localStorage.getItem('novaSubmissions')) || [];
            const legacyData = JSON.parse(localStorage.getItem('a4Submissions')) || [];
            const data = [...novaData, ...legacyData];
            container.innerHTML = '';

            if (data.length === 0) {
                const emptyMsg = document.createElement('p');
                emptyMsg.style.cssText = 'text-align: center; font-size: 1.2rem; margin-top: 2rem;';
                emptyMsg.textContent = 'No project inquiries yet. Test the transmission form on the homepage!';
                container.appendChild(emptyMsg);
                return;
            }

            // Loop backwards to show the newest messages first
            for (let i = data.length - 1; i >= 0; i--) {
                const sub = data[i];
                const card = document.createElement('div');
                card.className = 'sub-card';

                const subHeader = document.createElement('div');
                subHeader.className = 'sub-header';
                const dateSpan = document.createElement('span');
                dateSpan.textContent = 'Submitted: ' + (sub.date || 'N/A');
                subHeader.appendChild(dateSpan);
                card.appendChild(subHeader);

                const nameHeader = document.createElement('h4');
                nameHeader.textContent = sub.name || 'Anonymous';
                card.appendChild(nameHeader);

                const emailP = document.createElement('p');
                emailP.style.marginBottom = '1rem';
                const emailStrong = document.createElement('strong');
                emailStrong.textContent = 'Email: ';
                emailP.appendChild(emailStrong);

                const emailLink = document.createElement('a');
                const safeEmail = String(sub.email || '').trim();
                // Validate email to prevent javascript: pseudo-protocol injection
                if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(safeEmail)) {
                    emailLink.href = 'mailto:' + encodeURIComponent(safeEmail);
                } else {
                    emailLink.href = '#';
                }
                emailLink.className = 'text-orange';
                emailLink.style.fontWeight = '600';
                emailLink.textContent = safeEmail;
                emailP.appendChild(emailLink);
                card.appendChild(emailP);

                const msgBox = document.createElement('div');
                msgBox.style.cssText = 'padding: 1rem; background: var(--bg-cream); border: 2px solid var(--border-dark); font-family: var(--font-body); white-space: pre-wrap; word-break: break-word;';
                msgBox.textContent = sub.message || '';
                card.appendChild(msgBox);

                container.appendChild(card);
            }
        }

        clearBtn.addEventListener('click', () => {
            if (confirm('Are you absolutely sure you want to delete all form submissions? This cannot be undone.')) {
                localStorage.removeItem('novaSubmissions');
                localStorage.removeItem('a4Submissions');
                loadSubmissions();
            }
        });
    </script>
</body>

</html>
